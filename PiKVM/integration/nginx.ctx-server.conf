# PiKVM HID Automation integration.
# Loaded automatically by PiKVM's nginx configuration from /usr/share/kvmd/extras/*/.

location = /hid-automation {
    return 301 /hid-automation/;
}

# Keep the automation backend private on 127.0.0.1:8081 and expose it only
# through PiKVM's authenticated nginx frontend.
location /hid-automation/ {
    proxy_pass http://127.0.0.1:8081/;
    include /etc/kvmd/nginx/loc-proxy.conf;
    include /etc/kvmd/nginx/loc-login.conf;
    include /etc/kvmd/nginx/loc-nocache.conf;
}

# Inject only a tiny, self-contained navbar helper. The original PiKVM files
# remain untouched, so package updates can replace /usr/share/kvmd/web safely.
#
# try_files (rather than relying on the automatic "index" directive) matters
# here: for an exact-match location ending in "/", nginx's index module
# resolves a bare `alias`-mapped directory via an *internal redirect* to
# ".../index.html", which is then re-matched against the location table from
# scratch. That re-match escapes this location entirely (no exact "=" rule
# matches the synthesized URI) and falls through to the generic root
# location, which serves the same file correctly but without sub_filter -
# so the page renders fine but the injected script silently never appears.
# try_files resolves the file inside this location's own filter chain, so
# sub_filter (and any other directive here) actually applies.
location = /kvm/ {
    alias /usr/share/kvmd/web/kvm/;
    try_files index.html =404;
    include /etc/kvmd/nginx/loc-login.conf;
    include /etc/kvmd/nginx/loc-nocache.conf;
    sub_filter_once on;
    sub_filter '</body>' '<script src="../hid-automation/static/integration.js"></script></body>';
}
