[platformio]
src_dir = sketch

[env:lilygo-t-dongle-s3]
platform = espressif32
board = lilygo-t-dongle-s3-hid
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7735_DRIVER=1
  -DST7735_GREENTAB160x80=1
  -DTFT_WIDTH=80
  -DTFT_HEIGHT=160
  -DTFT_MISO=-1
  -DTFT_MOSI=3
  -DTFT_SCLK=5
  -DTFT_CS=4
  -DTFT_DC=2
  -DTFT_RST=1
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=LOW
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=6000000
